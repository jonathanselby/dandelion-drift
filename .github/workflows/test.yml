name: CI

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Module contract
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format contract
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l ./cmd ./internal)
          if [ -n "$files" ]; then
            echo "Go files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests with race detector
        run: go test -race -count=1 ./...

      - name: Linux amd64 build
        run: |
          mkdir -p ./bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o ./bin/dandelion-drift-linux-amd64 ./cmd/dandeliondrift

      - name: Linux arm64 build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o ./bin/dandelion-drift-linux-arm64 ./cmd/dandeliondrift

      - name: Release hardening acceptance
        run: >-
          go test ./internal/game
          -run 'TestHardeningRepresentativeRunsKeepStateSane|TestSpaceOnlyRunAdvancesWithoutHorizontalInput|TestFallingStateIgnoresHazardDamage|TestRepeatedCompletedFlightsStartClean|TestScoresSortedAndFiveOnly|TestScoreQualification|TestScoreSaveLoadRoundTrip|TestMissingScoresStartEmpty|TestMalformedScoresReportAndStartEmpty|TestInitialsAcceptOneToThreeLettersAndQuestionMark|TestCompletedFlightReturnsAndStartsFresh|TestDeterministicGameplayWithHazards|TestInvariantsHoldOverLongGeneration|TestLiveEntityBudgetAcrossLongWorlds|TestReleaseStartsAtFiftyPuffs|TestFlowerRechargesPuffs|TestFlowerRechargeCapsAtFull|TestFireflyDrainsPuffs|TestFireflyDrainCannotGoBelowZero'
          -count=1
