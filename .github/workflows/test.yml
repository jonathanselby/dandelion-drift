name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Module contract
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format contract
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l ./cmd ./internal)
          if [ -n "$files" ]; then
            echo "Go files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Linux amd64 build
        run: |
          mkdir -p ./bin
          go build -trimpath -ldflags="-s -w" -o ./bin/Dandelion-Drift-UAT ./cmd/dandeliondrift
          chmod +x ./bin/Dandelion-Drift-UAT
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ./bin/dandelion-drift-linux-arm64 ./cmd/dandeliondrift
      - name: Chunk 5 hardening acceptance
        run: >-
          go test ./internal/game
          -run 'TestHardeningRepresentativeRunsKeepStateSane|TestSpaceOnlyRunAdvancesWithoutHorizontalInput|TestFallingStateIgnoresHazardDamage|TestRepeatedCompletedFlightsStartClean|TestScoresSortedAndFiveOnly|TestScoreQualification|TestScoreSaveLoadRoundTrip|TestMissingScoresStartEmpty|TestMalformedScoresReportAndStartEmpty|TestInitialsAcceptOneToThreeLettersAndQuestionMark|TestCompletedFlightReturnsAndStartsFresh|TestDeterministicGameplayWithHazards|TestInvariantsHoldOverLongGeneration|TestLiveEntityBudgetAcrossLongWorlds'
          -count=1
      - name: Upload Linux UAT build
        uses: actions/upload-artifact@v4
        with:
          name: Dandelion-Drift-UAT-linux-amd64
          path: ./bin/Dandelion-Drift-UAT
          if-no-files-found: error
