name: Build UAT AppImage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/appimage-uat.yml

permissions:
  contents: read

jobs:
  build-appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Validate current game
        shell: bash
        run: |
          set -euo pipefail
          go test ./...

      - name: Build Dandelion Drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags='-s -w' \
            -o AppDir/usr/bin/DandelionDrift ./cmd/dandeliondrift

      - name: Create AppDir
        shell: bash
        run: |
          set -euo pipefail

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          set -eu
          data_dir="${XDG_DATA_HOME:-$HOME/.local/share}/dandelion-drift"
          mkdir -p "$data_dir"
          cd "$data_dir"
          exec "$APPDIR/usr/bin/DandelionDrift" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/DandelionDrift.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Dandelion Drift UAT v0.1
          Comment=Every flap spends your wings. Every flap plants tomorrow.
          Exec=DandelionDrift
          Icon=dandelion-drift
          Categories=Game;
          Terminal=false
          X-AppImage-Name=Dandelion Drift UAT
          X-AppImage-Version=0.1
          X-AppImage-Arch=x86_64
          EOF

          cat > AppDir/dandelion-drift.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="48" fill="#eef4df"/>
            <circle cx="128" cy="102" r="55" fill="#ffffff" stroke="#527a55" stroke-width="8"/>
            <circle cx="128" cy="102" r="9" fill="#b79a5b"/>
            <path d="M128 111 C126 150 120 182 108 218" fill="none" stroke="#527a55" stroke-width="8" stroke-linecap="round"/>
            <path d="M128 102 L128 38 M128 102 L170 53 M128 102 L188 102 M128 102 L170 151 M128 102 L86 53 M128 102 L68 102 M128 102 L86 151" stroke="#c7c3a6" stroke-width="5" stroke-linecap="round"/>
          </svg>
          EOF
          ln -s dandelion-drift.svg AppDir/.DirIcon

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool-x86_64.AppImage AppDir Dandelion-Drift-UAT-v0.1-x86_64.AppImage
          chmod +x Dandelion-Drift-UAT-v0.1-x86_64.AppImage

      - name: Verify AppImage
        shell: bash
        run: |
          set -euo pipefail
          ./Dandelion-Drift-UAT-v0.1-x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/DandelionDrift
          test -f squashfs-root/DandelionDrift.desktop
          test -f squashfs-root/dandelion-drift.svg
          rm -rf squashfs-root
          file Dandelion-Drift-UAT-v0.1-x86_64.AppImage
          sha256sum Dandelion-Drift-UAT-v0.1-x86_64.AppImage
          ls -lh Dandelion-Drift-UAT-v0.1-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Dandelion-Drift-UAT-v0.1-x86_64-AppImage
          path: Dandelion-Drift-UAT-v0.1-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
